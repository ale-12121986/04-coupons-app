<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center">
      Mis Cupones
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
<ion-segment>
  <ion-segment-button value="candies" content-id="candies">
    <ion-label>Candies</ion-label>
  </ion-segment-button>
  <ion-segment-button value="drinks" content-id="drinks">
    <ion-label>Drinks</ion-label>
  </ion-segment-button>
  <ion-segment-button value="meats" content-id="meats">
    <ion-label>Meats</ion-label>
  </ion-segment-button>
</ion-segment>
<ion-segment-view>
  <ion-segment-content id="candies">
    <ng-container [ngTemplateOutlet]="couponTemplate" [ngTemplateOutletContext]="{category: 'candies'}" />  
  </ion-segment-content>

  <ion-segment-content id="drinks">
    <ng-container [ngTemplateOutlet]="couponTemplate" [ngTemplateOutletContext]="{category: 'drinks'}" />
  </ion-segment-content>

  <ion-segment-content id="meats">
    <ng-container [ngTemplateOutlet]="couponTemplate" [ngTemplateOutletContext]="{category: 'meats'}" />
  </ion-segment-content>
</ion-segment-view>

<ng-template #couponTemplate let-category ="category">
  <ion-grid>
    <ion-row>
      @for(coupon of coupons | filterCouponCategory: category ; track coupon.IdProduct){
        <ion-col size="6">
          <ion-card class="rounded">
            <img [src]="coupon.img"/>
            <ion-card-header>
              <ion-card-subtitle class="ion-text-center">{{coupon.name}} </ion-card-subtitle>
              <ion-card-title class="ion-text-center">{{coupon.discount}}%</ion-card-title>
            </ion-card-header>
          </ion-card>
        </ion-col>
      }
    </ion-row>
  </ion-grid>
</ng-template>


</ion-content>
